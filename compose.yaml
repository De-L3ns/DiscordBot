services:
  kletserbot:
    build:
      context: .
    image: ${KLETSERBOT_IMAGE:-kletserbot:local}
    env_file:
      - ${KLETSERBOT_ENV_FILE:-.env}
    environment:
      CARDPACK_DATA_DIRECTORY: /app/data/cardpacks
    volumes:
      - cardpack-data:/app/data/cardpacks
    restart: unless-stopped
    init: true
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/kletserbot-ready"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s

volumes:
  cardpack-data:
    name: ${CARDPACK_DATA_VOLUME:-kletserbot-cardpack-data}
