name: Continuous integration

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Run tests
        run: python -m pytest

      - name: Check linting
        run: python -m ruff check .

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Check types
        run: python -m mypy src

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install --yes shellcheck

      - name: Check deployment scripts
        run: shellcheck deployment/*.sh

      - name: Validate test-bot Compose configuration
        run: KLETSERBOT_ENV_FILE=.env.testbot.example docker compose --env-file .env.testbot.example config --quiet

      - name: Build Docker image
        run: docker build --tag kletserbot:ci .
